[project]
name = "polybot"
version = "0.1.0"
description = "Extensible Polymarket trading bot skeleton"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
polybot = "polybot.cli:main"
